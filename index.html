<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZHINENG Browser Mockup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="browser-container">
        <aside class="sidebar">
            <div class="tab-group">
                <div class="tab-group-header">
                    <div class="tab-group-icon"> <span class="icon">Zh</span> </div>
                    <span class="tab-group-title">ZHINENG</span>
                    <span class="tab-group-arrow">&#9660;</span>
                </div>
                <div class="tab-list">
                    <div class="tab active" data-url="https://cse.google.com/cse?cx=c18f3250b0b5c45f0">
                        <div class="tab-icon"> <span class="icon">Zh</span> </div>
                        <span class="tab-title">ZHINENG</span>
                    </div>
                    <div class="tab" data-url="https://duckduckgo.com">
                        <div class="tab-icon"> <span class="icon">Zh</span> </div>
                        <span class="tab-title">ZHINENG</span>
                    </div>
                    <div class="tab" data-url="https://example.com">
                        <div class="tab-icon"> <span class="icon">Zh</span> </div>
                        <span class="tab-title">ZHINENG</span>
                    </div>
                </div>
            </div>
            <div class="tab new-tab">
                <span class="plus">+</span>
                <span>New Tab</span>
            </div>
            <div class="tab empty-tab">
                <span class="question">?</span>
                <span>Empty Tab</span>
            </div>
            <div class="tab empty-tab">
                <span class="question">?</span>
                <span>Empty Tab</span>
            </div>
        </aside>
        <main class="main-area">
            <header class="top-bar">
                <div class="address-bar">
                    <input type="text" placeholder="Welcome To ZHINENG — Search Google">
                    <span class="search-icon">🔍</span>
                </div>
                <div class="top-bar-icons">
                    <span class="menu-icon">☰</span>
                    <span class="download-icon">⬇️</span>
                    <span class="extension-icon">🔷</span>
                    <span class="new-tab-icon">+</span>
                </div>
            </header>
            <div class="search-results"></div>
            <section class="content-area">
                <div class="search-suggestions">
                    <div class="suggestion google">
                        <img src="https://www.google.com/favicon.ico" alt="Google">
                        <span>Google</span>
                    </div>
                    <div class="suggestion youtube">
                        <img src="https://www.youtube.com/s/desktop/6e8e6e8e/img/favicon_144x144.png" alt="YouTube">
                        <span>YouTube</span>
                    </div>
                    <div class="suggestion bing">
                        <img src="https://www.bing.com/sa/simg/favicon-2x.ico" alt="Bing">
                        <span>Bing</span>
                    </div>
                    <div class="suggestion github">
                        <img src="https://github.githubassets.com/favicons/favicon.png" alt="GitHub">
                        <span>GitHub</span>
                    </div>
                    <div class="suggestion oppo">
                        <img src="https://www.oppo.com/favicon.ico" alt="Oppo">
                        <span>Oppo</span>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
